name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure basePath
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -f public/CNAME ]]; then
            # Custom domain is configured — site is served from root (no sub-path).
            echo "Custom domain (CNAME) detected -> serve from root"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "User/org Pages repo -> serve from root"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project Pages repo -> serve from /$REPO"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages if the site record is missing/inactive
          # (fixes "Get Pages site failed" when configure-pages hits 404).
          # enablement works reliably with a classic PAT / fine-grained token
          # (scope: Pages write); falls back to GITHUB_TOKEN otherwise.
          token: ${{ secrets.PAGES_PAT || github.token }}
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
